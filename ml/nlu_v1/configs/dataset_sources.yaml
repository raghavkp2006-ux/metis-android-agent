stage: REGISTRY_ONLY
metadata_evidence: ml/nlu_v1/configs/dataset_source_evidence.json
policy:
  default_use: DENY
  unclear_license_identity_or_split: BLOCK
  payload_downloaded: false
  training_authorized: false
  final_independent_test_from_public_sources: false
  mapping_decisions: [MAP, KNOWN_UNSUPPORTED, OOD, DROP]
  unmapped_intent: BLOCK
  denied_legacy_classes: [EXPOSED, PROTECTED_EVALUATION, PRIVATE_DO_NOT_PUBLISH]
  hash_algorithm: SHA-256
  hash_scope: Exact raw downloaded bytes; no newline or Unicode normalization
  intake_manifest_required:
    - requested_url
    - resolved_url
    - source_revision
    - downloaded_at_utc
    - archive_sha256
    - archive_size_bytes
    - member_path
    - member_sha256
    - license_sha256
    - original_split
    - locale
    - mapper_version
    - approval_id
  hash_mismatch: QUARANTINE
  missing_hash: BLOCK_USE
  unknown_split: QUARANTINE
  publication: Separate per-artifact license/privacy review; never infer from training eligibility
