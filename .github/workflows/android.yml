name: Android verification

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, unit tests, lint, static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' package is no longer available from Google.
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:detekt :app:assembleCapabilityTest :app:assembleCapabilityTestAndroidTest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify archive integrity, packaged assets and harness safety
        run: |
          python -m unittest discover -s tools/legacy_ml -p 'test_*.py' -v
          python -m unittest discover -s tools/capability_testing -p 'test_*.py' -v
          python tools/legacy_ml/check.py --apks app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Verify synthetic APK identities
        run: ./gradlew --no-daemon :app:verifyCapabilityTestApks
      - name: Upload reports and debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-and-debug-apk
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/debug/
          if-no-files-found: warn

  android-smoke:
    name: Android smoke tests (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build synthetic application and instrumentation
        run: ./gradlew --no-daemon :app:assembleCapabilityTest :app:assembleCapabilityTestAndroidTest
      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          # At 320px, the 839dp/840dp responsive-test boundaries round to the same pixel.
          profile: pixel_6
          disable-animations: true
          emulator-port: 5554
          emulator-boot-timeout: 600
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            python tools/capability_testing/emulator_ready.py --sdk "$ANDROID_HOME" --serial emulator-5554
            python tools/capability_testing/harness.py proof --sdk "$ANDROID_HOME" --app app/build/outputs/apk/capabilityTest/app-capabilityTest.apk --test app/build/outputs/apk/androidTest/capabilityTest/app-capabilityTest-androidTest.apk --serial emulator-5554 --output app/build/reports/capability-testing/emulator-proof
            python tools/capability_testing/harness.py suite --sdk "$ANDROID_HOME" --app app/build/outputs/apk/capabilityTest/app-capabilityTest.apk --test app/build/outputs/apk/androidTest/capabilityTest/app-capabilityTest-androidTest.apk --serial emulator-5554 --proof app/build/reports/capability-testing/emulator-proof/result.json --output app/build/reports/capability-testing/emulator-suite
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/capability-testing/
          if-no-files-found: warn
