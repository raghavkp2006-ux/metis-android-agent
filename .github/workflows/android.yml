name: Android verification

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, unit tests, lint, static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' package is no longer available from Google.
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:detekt :app:assembleDebugAndroidTest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/evaluation/phase15/requirements.txt
      - name: Install development evaluation dependencies
        run: python -m pip install -r docs/evaluation/phase15/read_queries_v5/requirements.txt
      - name: Evaluate Phase 15 candidate (a no-go decision keeps rules)
        run: |
          python -m unittest discover -s docs/evaluation/phase15 -p 'test_*.py' -v
          ./gradlew --no-daemon :app:phase15RulesSnapshot
          python docs/evaluation/phase15/evaluate.py
      - name: Evaluate Phase 15 read-query development candidate
        run: |
          python -m unittest discover -s docs/evaluation/phase15/read_queries_v3 -p 'test_*.py' -v
          ./gradlew --no-daemon :app:phase15ReadRulesSnapshot
          python docs/evaluation/phase15/read_queries_v3/evaluate.py
      - name: Evaluate Phase 15 v4 development candidate
        run: |
          ./gradlew --no-daemon :app:phase15ReadRulesSnapshot -Pphase15ReadInput=docs/evaluation/phase15/read_queries_v4/rules-input-v4.tsv -Pphase15ReadOutput=app/build/reports/phase15/rules-v4.tsv
          python docs/evaluation/phase15/read_queries_v4/v4_evaluate.py
      - name: Evaluate Phase 15 v5 intent and read behavior
        run: |
          python -m unittest discover -s docs/evaluation/phase15/read_queries_v5 -p 'test_*.py' -v
          ./gradlew --no-daemon :app:phase15ReadRulesSnapshot -Pphase15ReadInput=docs/evaluation/phase15/read_queries_v5/rules-input-v5.tsv -Pphase15ReadOutput=app/build/reports/phase15/rules-v5.tsv
          python docs/evaluation/phase15/read_queries_v5/evaluate.py
      - name: Verify Phase 15 v6 exposed safety regressions (ML disabled)
        run: |
          python -m unittest discover -s docs/evaluation/phase15/read_safety_v6 -p 'test_*.py' -v
          ./gradlew --no-daemon :app:phase15ReadRulesSnapshot -Pphase15ReadInput=docs/evaluation/phase15/human_review_003/first_evaluation/frozen-benchmark.tsv -Pphase15ReadOutput=app/build/reports/phase15/v6/native-exposed.tsv
          python docs/evaluation/phase15/read_safety_v6/evaluate.py
      - name: Verify Phase 15 v16 scopes and retained historical behavior (ML disabled)
        run: |
          python docs/evaluation/phase15/read_candidate_v16/historical_tests.py
          python docs/evaluation/phase15/read_candidate_v16/integrity.py
          python -m unittest discover -s docs/evaluation/phase15/read_candidate_v16 -p 'test_*.py' -v
          python -m unittest discover -s docs/evaluation/phase15/classifier_v16 -p 'test_*.py' -v
          python -m unittest discover -s docs/evaluation/phase15/calibration_intake_006 -p 'test_intake.py' -v
          python docs/evaluation/phase15/read_candidate_v16/historical_tests.py --evaluate
          python docs/evaluation/phase15/read_candidate_v16/evaluate.py
      - name: Upload reports and debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-and-debug-apk
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/debug/
          if-no-files-found: warn

  android-smoke:
    name: Android smoke tests (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
