name: Phase 15 v15 scoped retrieval and disabled classifier gates

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/evaluation/phase15/requirements.txt
      - run: python -m pip install -r docs/evaluation/phase15/requirements.txt
      - name: Current certificate, retained classifier behavior and fitting isolation
        run: |
          python docs/evaluation/phase15/candidate_v15/historical_tests.py
          python docs/evaluation/phase15/candidate_v15/integrity.py
          python -m unittest discover -s docs/evaluation/phase15/candidate_v15 -p 'test_*.py' -v
      - name: Native request gates and local-calendar scopes
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest --tests dev.metis.agent.ClassifierV11SafetyTest --tests dev.metis.agent.ReadCoverageV10Test --tests dev.metis.agent.CandidateV12ReadTest --tests dev.metis.agent.CalendarV13Test --tests dev.metis.agent.CandidateV14Test --tests dev.metis.agent.CandidateV15Test
          python docs/evaluation/phase15/candidate_v15/v15_evaluate.py
          python docs/evaluation/phase15/candidate_v15/reviewed_evaluate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase15-v15-development
          path: app/build/reports/
          if-no-files-found: warn
